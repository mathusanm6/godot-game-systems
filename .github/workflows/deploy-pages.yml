name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            cp -r /root/.config/godot ~/.config/
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Create export directory and setup hub
        run: |
          mkdir -v -p build/web/card-system
          mkdir -v -p build/web/chess-movement-system
          cp index.html build/web/index.html
          cp -r assets media build/web/

      - name: Export Web
        run: |
          EXPORT_DIR="$(readlink -f build)"
          cd card-system
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/card-system/index.html"
          cd ../chess-movement-system
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/chess-movement-system/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
